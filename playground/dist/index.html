<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solve Engine Playground</title>
    
    
  <script type="module" crossorigin src="/assets/index-c207b8ad.js"></script>
  <link rel="stylesheet" href="/assets/index-0ca75e66.css">
</head>
<body>
    <header class="app-banner">
        <h1>Solve Engine Playground</h1>
        <p>Debug lexer, parser, and execution</p>
    </header>

    <div class="container">
        <div class="sidebar-column">
            <div class="sidebar-header"><h2>Examples</h2></div>
            <div class="sidebar-content" id="examples-sidebar"></div>
        </div>

        <div class="editor-column">
            <div class="full-doc-section">
                <label for="full-doc-select">Full Document Examples</label>
                <select id="full-doc-select">
                    <option value="">-- Select a full document example --</option>
                </select>
            </div>

            <div class="editor-section">
                <div id="editor-container"></div>
            </div>
        </div>

        <div class="results-column">
            <div class="results-scroll">
                <div class="panel output-panel">
                    <h3>Results by Line</h3>
                    <div id="line-results-display"></div>
                </div>

                <div id="debug-panels">
                    <div class="panel tokens-panel">
                        <h3>Tokens <label class="tokens-toggle-label"><input type="checkbox" id="group-tokens" checked> Group by line</label></h3>
                        <div id="tokens-display"></div>
                    </div>

                    <div class="panel variables-panel"><h3>Variables</h3><div id="variables-display"></div></div>
                    <div class="panel opcodes-panel"><h3>Opcodes</h3><div id="opcodes-display"></div></div>
                    <div class="panel constants-panel"><h3>Constants</h3><div id="constants-display"></div></div>

                    <div class="panel errors-panel">
                        <h3>Errors</h3>
                        <div id="errors-display"></div>
                    </div>

                    <div class="panel markdown-outline-panel"><h3>Markdown Outline</h3><div id="markdown-outline-display"></div></div>
                    <div class="panel ast-panel"><h3>Parse Structure</h3><div id="ast-display"></div></div>

                    <div class="panel stats-panel">
                        <h3>Performance Stats</h3>
                        <div id="stats-display"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
